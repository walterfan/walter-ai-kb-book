# Excerpt manifest — single source of truth for vendored code excerpts.
#
# One entry per excerpt. `excerpt_path` is relative to `book/examples/`.
# `source_repo` must be one of the keys in `refresh_excerpts.py` KNOWN_REPOS.
# `source_path` is relative to the source repo root.
#
# Regenerate everything with:
#     make book-refresh-excerpts
#
# Verify freshness (used by CI) with:
#     python3 book/_tools/refresh_excerpts.py --check

excerpts:

  # --- Part II — The Prose Layer (ch04 – ch07) ---

  - excerpt_path: part2-prose-layer/ch04/repository.go
    source_repo:  lazy-rabbit-wiki
    source_path:  backend/internal/wiki/repository.go

  - excerpt_path: part2-prose-layer/ch04/service.go
    source_repo:  lazy-rabbit-wiki
    source_path:  backend/internal/wiki/service.go

  - excerpt_path: part2-prose-layer/ch05/frontmatter.go
